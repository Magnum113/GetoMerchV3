[Unit]
After=network-online.target getomerch-marking-signer.service
Wants=network-online.target
Requires=getomerch-marking-signer.service

[Service]
LoadCredential=marking-keyring:/etc/getomerch/credentials/marking-keyring.json
LoadCredential=marking-signer-client-secret:/etc/getomerch/credentials/marking-signer-client-secret
RestrictAddressFamilies=AF_UNIX AF_INET AF_INET6
IPAddressDeny=
